<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ingresar · Chile Consultores</title>
<link rel="stylesheet" href="../[base]/base.css">
<!--
  Plantilla: tarjeta de acceso con tabs Ingresar / Crear cuenta. Error genérico (no revela si el correo existe), bloqueo temporal tras 5 intentos con cuenta regresiva, RUT con módulo 11 y formato, medidor de fuerza con requisitos en vivo, Google (solo UI).
  Proyecto: login de Clima, Mystery, CRM, DataDash y demás apps privadas.
  Cómo aplicarlo: copia el bloque main, el bloque style y el bloque script. Soporta ?next=/ruta (solo rutas internas) y ?expirada=1 (aviso "Tu sesión expiró").
  Conectar: reemplaza el objeto API (login, registrar, google) por Supabase: auth.signInWithPassword, auth.signUp, auth.signInWithOAuth. El bloqueo real de intentos debe hacerlo el servidor. Prueba: clave Demo1234! entra.
  Ganchos: API, #f-ing, #f-reg, #err-ing, #err-reg, entrar().
  Reglas UX: mismo error para correo inexistente o clave mala, foco al primer error o al aviso, validación al salir del campo, mostrar/ocultar clave, requisitos visibles sin depender del color.
-->
<style>
  [hidden]{display:none}
  .lg-centro{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
  .lg-tarjeta{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;padding:28px 24px}
  @media (max-width:480px){.lg-tarjeta{padding:24px 16px}}
  .lg-pag .btn,.lg-pag .input,.lg-pag .check,.lg-enlace{min-height:44px}
  .lg-logo{justify-content:center}
  .lg-pag .tabs{margin:0}
  .lg-pag .tabs button{flex:1;min-height:44px}
  .lg-enlace{display:inline-flex;align-items:center;font-size:var(--fs-s)}
  .lg-clave{position:relative}
  .lg-clave .input{padding-right:92px}
  .lg-ojo{position:absolute;right:2px;top:2px;bottom:2px;min-height:0}
  .lg-o{display:flex;align-items:center;gap:12px;color:var(--texto-3);font-size:var(--fs-xs)}
  .lg-o::before,.lg-o::after{content:"";flex:1;border-top:1px solid var(--borde)}
  .lg-req{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:var(--fs-xs);color:var(--texto-3)}
  .lg-req li::before{content:"○ "}
  .lg-req li.ok{color:var(--verde)} .lg-req li.ok::before{content:"✓ "}
</style>
</head>
<body>
<div class="aurora"></div><div class="estrellas"></div>
<main class="lg-centro lg-pag">
  <div class="card lg-tarjeta">
    <div class="logo lg-logo"><span class="dot"></span>Chile Consultores</div>
    <h1 class="sr-only">Acceso a Chile Consultores</h1>
    <div class="aviso warn" id="expirada" role="status" hidden>Tu sesión expiró. Ingresa de nuevo para continuar.</div>
    <div class="tabs" role="tablist" aria-label="Acceso">
      <button role="tab" id="t-ing" aria-controls="p-ing" aria-selected="true">Ingresar</button>
      <button role="tab" id="t-reg" aria-controls="p-reg" aria-selected="false">Crear cuenta</button>
    </div>

    <section id="p-ing" role="tabpanel" aria-labelledby="t-ing">
      <form id="f-ing" class="stack" novalidate>
        <div class="aviso bad" id="err-ing" role="alert" tabindex="-1" hidden></div>
        <div class="campo"><label for="i-correo">Correo</label>
          <input class="input" id="i-correo" name="correo" type="email" autocomplete="username" inputmode="email" placeholder="tu@empresa.cl">
          <div class="error-msg"></div></div>
        <div class="campo"><label for="i-clave">Clave</label>
          <div class="lg-clave"><input class="input" id="i-clave" name="clave" type="password" autocomplete="current-password">
            <button type="button" class="btn btn-ghost lg-ojo" data-ojo="i-clave" aria-controls="i-clave">Mostrar</button></div>
          <div class="error-msg"></div></div>
        <div class="row between wrap">
          <label class="check"><input type="checkbox" name="recordar">Recuérdame</label>
          <a class="lg-enlace" href="recuperar-clave.html">¿Olvidaste tu clave?</a>
        </div>
        <button class="btn btn-lg" id="b-ing" data-busy="Ingresando…">Ingresar</button>
        <div class="lg-o">o</div>
        <button type="button" class="btn btn-sec btn-lg" id="b-google">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.35 11.1H12v2.9h5.35c-.5 2.4-2.5 3.6-5.35 3.6a6 6 0 110-12c1.5 0 2.8.55 3.8 1.45l2.1-2.1A9 9 0 1012 21c5.2 0 8.6-3.65 8.6-8.8 0-.4-.05-.75-.25-1.1z"/></svg>Continuar con Google</button>
      </form>
    </section>

    <section id="p-reg" role="tabpanel" aria-labelledby="t-reg" hidden>
      <form id="f-reg" class="stack" novalidate>
        <div class="aviso bad" id="err-reg" role="alert" tabindex="-1" hidden></div>
        <div class="campo"><label for="r-nombre">Nombre completo</label>
          <input class="input" id="r-nombre" name="nombre" autocomplete="name"><div class="error-msg"></div></div>
        <div class="campo"><label for="r-correo">Correo</label>
          <input class="input" id="r-correo" name="correo" type="email" autocomplete="email" inputmode="email" placeholder="tu@empresa.cl"><div class="error-msg"></div></div>
        <div class="campo"><label for="r-rut">RUT</label>
          <input class="input" id="r-rut" name="rut" autocomplete="off" inputmode="text" placeholder="12.345.678-5" maxlength="12"><div class="error-msg"></div></div>
        <div class="campo"><label for="r-clave">Clave</label>
          <div class="lg-clave"><input class="input" id="r-clave" name="clave" type="password" autocomplete="new-password" aria-describedby="med">
            <button type="button" class="btn btn-ghost lg-ojo" data-ojo="r-clave" aria-controls="r-clave">Mostrar</button></div>
          <div id="med"><div class="progreso"><span></span></div><p class="small muted" data-nivel></p><ul class="lg-req"></ul></div>
          <div class="error-msg"></div></div>
        <div class="campo"><label class="check"><input type="checkbox" name="terminos">
          <span>Acepto los <a href="terminos.html" target="_blank" rel="noopener">términos y la política de privacidad</a></span></label>
          <div class="error-msg"></div></div>
        <button class="btn btn-lg" id="b-reg" data-busy="Creando cuenta…">Crear cuenta</button>
      </form>
    </section>
  </div>
</main>
<script src="../[base]/base.js"></script>
<script>
  const espera = ms => new Promise(r => setTimeout(r, ms));
  // CONECTAR: reemplaza cada función por Supabase. Deben devolver { ok: boolean }.
  const API = {
    login: async (correo, clave, recordar) => { await espera(600); return { ok: clave === 'Demo1234!' }; },
    registrar: async datos => { await espera(800); return { ok: true }; },
    google: async () => { await espera(500); return { ok: true }; }
  };

  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const siguiente = /^\/(?![\/\\])/.test(q.get('next') || '') ? q.get('next') : '/';
  const entrar = () => { UI.toast('Listo, entrando a tu panel…', 'ok'); setTimeout(() => location.assign(siguiente), 700); };
  const falla = (el, msg) => { el.textContent = msg; el.hidden = false; el.focus(); };
  if (q.get('expirada') === '1') $('expirada').hidden = false;

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-ojo]'); if (!b) return;
    const i = $(b.dataset.ojo), ver = i.type === 'password';
    i.type = ver ? 'text' : 'password'; b.textContent = ver ? 'Ocultar' : 'Mostrar';
  });

  const REQ = [['8 o más caracteres', v => v.length >= 8], ['Mayúscula y minúscula', v => /[a-z]/.test(v) && /[A-Z]/.test(v)], ['Un número', v => /\d/.test(v)], ['Un símbolo', v => /[^\w\s]/.test(v)]];
  function medidor(inp, raiz) {
    const li = REQ.map(([t]) => { const l = document.createElement('li'); l.textContent = t; raiz.querySelector('ul').append(l); return l; });
    const act = () => {
      const ok = REQ.filter(([, f], i) => { const b = f(inp.value); li[i].classList.toggle('ok', b); return b; }).length;
      raiz.querySelector('.progreso').style.setProperty('--p', ok / 4);
      raiz.querySelector('[data-nivel]').textContent = inp.value ? ['Muy débil', 'Débil', 'Media', 'Fuerte', 'Muy fuerte'][ok] : '';
      return ok;
    };
    inp.addEventListener('input', act); return act;
  }

  const rutLimpio = v => v.replace(/[^0-9kK]/g, '').toUpperCase();
  const rutFormato = v => { const l = rutLimpio(v); return l.length < 2 ? l : l.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + l.slice(-1); };
  function rutValido(v) {
    const l = rutLimpio(v); if (!/^\d{7,8}[\dK]$/.test(l)) return false;
    let s = 0, m = 2;
    for (let i = l.length - 2; i >= 0; i--) { s += l[i] * m; m = m === 7 ? 2 : m + 1; }
    const r = 11 - s % 11;
    return l.slice(-1) === (r === 11 ? '0' : r === 10 ? 'K' : String(r));
  }
  const correoOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) ? '' : 'Escribe un correo válido, por ejemplo tu@empresa.cl.';
  const primerError = f => f.querySelector('[aria-invalid="true"]').focus();

  /* Ingresar */
  const fi = $('f-ing'), bIng = $('b-ing');
  let intentos = 0, bloqueado = false;
  const validarIng = UI.validar(fi, { correo: correoOk, clave: v => v ? '' : 'Ingresa tu clave.' });

  function bloquear() {
    bloqueado = true; bIng.disabled = true;
    falla($('err-ing'), 'Demasiados intentos. Por seguridad, espera para volver a intentar.');
    let s = 30; const pintar = () => { bIng.textContent = 'Reintenta en ' + s + ' s'; }; pintar();
    const t = setInterval(() => {
      if (--s > 0) return pintar();
      clearInterval(t); bloqueado = false; intentos = 0; bIng.disabled = false; bIng.textContent = 'Ingresar'; $('err-ing').hidden = true;
    }, 1000);
  }

  fi.addEventListener('submit', async e => {
    e.preventDefault(); if (bloqueado) return;
    if (!validarIng()) return primerError(fi);
    $('err-ing').hidden = true;
    try {
      const r = await UI.busy(bIng, () => API.login(fi.elements.correo.value.trim(), fi.elements.clave.value, fi.elements.recordar.checked));
      if (r.ok) return entrar();
      if (++intentos >= 5) return bloquear();
      falla($('err-ing'), 'Correo o clave incorrectos. Revisa tus datos e intenta de nuevo.');
    } catch (_) { falla($('err-ing'), 'No pudimos conectar. Intenta de nuevo en unos segundos.'); }
  });

  $('b-google').addEventListener('click', async e => {
    try { const r = await UI.busy(e.currentTarget, API.google); if (r.ok) entrar(); }
    catch (_) { UI.toast('No pudimos conectar con Google.', 'error'); }
  });

  /* Crear cuenta */
  const fr = $('f-reg');
  const nivelClave = medidor(fr.elements.clave, $('med'));
  fr.elements.rut.addEventListener('input', e => { e.target.value = rutFormato(e.target.value); });
  const validarReg = UI.validar(fr, {
    nombre: v => v.trim().length >= 3 ? '' : 'Escribe tu nombre completo.',
    correo: correoOk,
    rut: v => rutValido(v) ? '' : 'RUT no válido. Revisa el número y el dígito verificador.',
    clave: () => nivelClave() === 4 ? '' : 'Tu clave debe cumplir todos los requisitos.',
    terminos: (v, f) => f.elements.terminos.checked ? '' : 'Debes aceptar los términos para crear tu cuenta.'
  });

  fr.addEventListener('submit', async e => {
    e.preventDefault();
    if (!validarReg()) return primerError(fr);
    $('err-reg').hidden = true;
    const d = Object.fromEntries(['nombre', 'correo', 'rut', 'clave'].map(n => [n, fr.elements[n].value.trim()]));
    try {
      const r = await UI.busy($('b-reg'), () => API.registrar(d));
      if (!r.ok) throw new Error();
      UI.toast('Cuenta creada. Te enviamos un correo para confirmarla.', 'ok');
      $('t-ing').click(); $('i-correo').value = d.correo; fr.reset(); nivelClave(); $('i-clave').focus();
    } catch (_) { falla($('err-reg'), 'No pudimos crear la cuenta. Intenta de nuevo.'); }
  });
</script>
</body>
</html>
