<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Paleta de comandos · Chile Consultores</title>
<link rel="stylesheet" href="../[base]/base.css">
<!--
  Plantilla: paleta de comandos estilo Ctrl+K (búsqueda difusa con resaltado, grupos, recientes, atajos, acciones con parámetro y navegación por teclado).
  Proyecto: apps privadas de Chile Consultores (CRM, Clima, DataDash, Helpdesk).
  Cómo aplicarlo: copia el CSS `.pal` y la función `Paleta.abrir()`. Registra comandos con `Paleta.registrar({id, grupo, titulo, palabras, atajo, accion})`.
  Conectar: la acción puede navegar (location.hash) o llamar funciones de tu app. Los recientes se guardan en localStorage con try/catch.
  Ganchos: Ctrl/Cmd+K abre, "/" abre, Escape cierra, ↑ ↓ navegan, Enter ejecuta, Tab sugiere, window.Paleta.
  Accesibilidad: role=dialog + combobox + listbox, aria-activedescendant, el foco vuelve al elemento previo.
-->
<style>
  .pagina{max-width:900px;margin:0 auto;padding:40px 16px 80px;display:flex;flex-direction:column;gap:20px}
  .small{font-size:var(--fs-s);color:var(--texto-2)}
  kbd{font:inherit;font-size:.75rem;padding:2px 7px;border:1px solid var(--borde);border-bottom-width:2px;border-radius:6px;background:var(--superficie-2);color:var(--texto-2)}
  .tarjeta{border:1px solid var(--borde);border-radius:var(--r);background:var(--superficie);padding:18px;display:flex;flex-direction:column;gap:12px}
  .fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .disp{display:flex;align-items:center;gap:10px;width:100%;max-width:420px;padding:10px 14px;border-radius:12px;border:1px solid var(--borde);background:var(--superficie-2);color:var(--texto-2);font:inherit;cursor:pointer;text-align:left}
  .disp:hover{border-color:var(--marca);color:var(--texto)}
  .disp kbd{margin-left:auto}
  .ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #vista{min-height:90px;display:grid;place-items:center;text-align:center}
  #vista b{font-size:1.4rem}
  body.tema-claro{filter:invert(1) hue-rotate(180deg)}

  /* === COMPONENTE: paleta === */
  .pal-velo{position:fixed;inset:0;z-index:1000;background:rgba(5,5,12,.62);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding:12vh 14px 14px;opacity:0;transition:opacity .18s}
  .pal-velo.on{opacity:1}
  .pal{width:min(620px,100%);max-height:min(540px,76vh);display:flex;flex-direction:column;background:var(--superficie-2);border:1px solid var(--borde);border-radius:18px;box-shadow:0 40px 90px rgba(0,0,0,.6);overflow:hidden;transform:translateY(-8px) scale(.98);transition:transform .22s var(--ease-salida)}
  .pal-velo.on .pal{transform:none}
  .pal-cab{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--borde)}
  .pal-cab input{flex:1;background:none;border:0;outline:0;color:var(--texto);font:inherit;font-size:1.05rem;min-width:0}
  .pal-cab .pref{font-size:.75rem;padding:2px 8px;border-radius:99px;background:rgba(124,109,242,.25);color:var(--texto)}
  .pal-lista{overflow:auto;padding:6px;flex:1}
  .pal-g{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--texto-2);padding:10px 12px 4px}
  .pal-it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;min-height:42px}
  .pal-it[aria-selected=true]{background:rgba(124,109,242,.24)}
  .pal-it .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pal-it mark{background:none;color:var(--acento);font-weight:700}
  .pal-it .at{display:flex;gap:4px}
  .pal-vacio{padding:28px 12px;text-align:center;color:var(--texto-2)}
  .pal-pie{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--borde);font-size:.75rem;color:var(--texto-2);flex-wrap:wrap}
  @media(max-width:560px){.pal-velo{padding-top:6vh}.pal-pie .solo-desk{display:none}}
  @media (prefers-reduced-motion:reduce){.pal-velo,.pal{transition:none}}
</style>
</head>
<body>
<main class="pagina">
  <header><h1 class="gradient-text" style="margin:0 0 6px">Paleta de comandos</h1><p class="small" style="margin:0">Todo a dos teclas de distancia. Prueba con <kbd>Ctrl</kbd> <kbd>K</kbd> o <kbd>/</kbd>.</p></header>
  <div class="tarjeta">
    <button class="disp" id="btn-abrir" type="button" aria-haspopup="dialog"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Buscar o ejecutar un comando...</span><kbd>Ctrl K</kbd></button>
    <p class="small">Escribe parte del nombre (ej: "inf", "nuevo cli", "oscuro"). Empieza con <kbd>&gt;</kbd> para ver solo acciones o <kbd>#</kbd> para ir a una página.</p>
  </div>
  <div class="tarjeta"><div class="small">Última acción ejecutada</div><div id="vista" aria-live="polite"><b>Ninguna todavía</b></div></div>
</main>

<script src="../[base]/base.js" defer></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  const NS = 'http://www.w3.org/2000/svg';
  const IC = { ir: 'M5 12h14M13 6l6 6-6 6', mas: 'M12 5v14M5 12h14', luna: 'M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z', copiar: 'M9 9h11v11H9zM5 15V4h11', salir: 'M9 21H5V3h4M16 17l5-5-5-5M21 12H9', buscar: 'M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5', rayo: 'M13 2L4 14h7l-1 8 9-12h-7z' };
  const ic = k => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'ico'); s.setAttribute('aria-hidden', 'true'); const p = document.createElementNS(NS, 'path'); p.setAttribute('d', IC[k]); s.appendChild(p); return s; };
  const vista = $('#vista');
  const hecho = t => { vista.replaceChildren(el('b', 'gradient-text', t)); if (window.UI && UI.toast) UI.toast(t, 'ok'); };

  /* === COMPONENTE: Paleta === */
  const cmds = [], KEY = 'pal-recientes';
  let rec = []; try { rec = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  /* puntaje difuso: prefijo > palabra > subcadena > subsecuencia */
  function puntaje(q, c) {
    const t = norm(c.titulo), k = norm(c.palabras || ''), x = norm(q); if (!x) return 1;
    if (t.startsWith(x)) return 100; if (t.split(/\s+/).some(w => w.startsWith(x))) return 80;
    if (t.includes(x)) return 60; if (k.includes(x)) return 40;
    let i = 0; for (const ch of t) { if (ch === x[i]) i++; if (i === x.length) return 20; } return 0;
  }
  function resaltar(txt, q) { const f = document.createDocumentFragment(); const x = norm(q); if (!x) { f.append(txt); return f; } const i = norm(txt).indexOf(x); if (i < 0) { f.append(txt); return f; } f.append(txt.slice(0, i)); f.appendChild(el('mark', '', txt.slice(i, i + x.length))); f.append(txt.slice(i + x.length)); return f; }

  let velo, inp, lista, sel = 0, vis = [], previo = null, modo = '';
  function construir() {
    velo = el('div', 'pal-velo'); const p = el('div', 'pal'); p.setAttribute('role', 'dialog'); p.setAttribute('aria-modal', 'true'); p.setAttribute('aria-label', 'Paleta de comandos');
    const cab = el('div', 'pal-cab'); cab.appendChild(ic('buscar')); const pref = el('span', 'pref'); pref.hidden = true; pref.id = 'pal-pref'; inp = el('input'); inp.type = 'text'; inp.name = 'comando'; inp.placeholder = 'Escribe un comando o busca...'; inp.autocomplete = 'off'; inp.setAttribute('role', 'combobox'); inp.setAttribute('aria-expanded', 'true'); inp.setAttribute('aria-controls', 'pal-lista'); inp.setAttribute('aria-label', 'Comando'); cab.append(pref, inp);
    lista = el('div', 'pal-lista'); lista.id = 'pal-lista'; lista.setAttribute('role', 'listbox');
    const pie = el('div', 'pal-pie'); [['↑↓', 'Navegar'], ['Enter', 'Ejecutar'], ['Esc', 'Cerrar']].forEach(([k, t]) => { const s = el('span'); s.append(el('kbd', '', k), document.createTextNode(' ' + t)); pie.appendChild(s); }); const tp = el('span', 'solo-desk'); tp.style.marginLeft = 'auto'; tp.append(el('kbd', '', '>'), document.createTextNode(' acciones  '), el('kbd', '', '#'), document.createTextNode(' páginas')); pie.appendChild(tp);
    p.append(cab, lista, pie); velo.appendChild(p);
    velo.addEventListener('mousedown', e => { if (e.target === velo) cerrar(); });
    inp.addEventListener('input', () => { sel = 0; pintar(); });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); cerrar(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); mover(1); } else if (e.key === 'ArrowUp') { e.preventDefault(); mover(-1); }
      else if (e.key === 'Home') { sel = 0; marcar(); } else if (e.key === 'End') { sel = vis.length - 1; marcar(); }
      else if (e.key === 'Enter') { e.preventDefault(); ejecutar(sel); }
      else if (e.key === 'Tab') { e.preventDefault(); if (vis[sel]) { inp.value = vis[sel].titulo; pintar(); } }
      else if (e.key === 'Backspace' && !inp.value && modo) { modo = ''; pref.hidden = true; pintar(); }
    });
    lista.addEventListener('click', e => { const it = e.target.closest('.pal-it'); if (it) ejecutar(+it.dataset.i); });
    lista.addEventListener('mousemove', e => { const it = e.target.closest('.pal-it'); if (it && +it.dataset.i !== sel) { sel = +it.dataset.i; marcar(false); } });
    document.body.appendChild(velo);
  }
  function filtrar() {
    let q = inp.value; const pref = $('#pal-pref');
    if (!modo && (q[0] === '>' || q[0] === '#')) { modo = q[0]; q = q.slice(1).trimStart(); inp.value = q; pref.textContent = modo === '>' ? 'Acciones' : 'Páginas'; pref.hidden = false; }
    const base = cmds.filter(c => !modo || (modo === '>' ? c.tipo === 'accion' : c.tipo === 'pagina'));
    if (!q.trim()) { const r = rec.map(id => base.find(c => c.id === id)).filter(Boolean).slice(0, 4).map(c => ({ ...c, g: 'Recientes' })); const resto = base.filter(c => !r.some(x => x.id === c.id)).map(c => ({ ...c, g: c.grupo })); return { q, l: [...r, ...resto] }; }
    return { q, l: base.map(c => ({ c, s: puntaje(q, c) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).map(x => ({ ...x.c, g: x.c.grupo })).slice(0, 30) };
  }
  function pintar() {
    const { q, l } = filtrar(); vis = l; lista.replaceChildren();
    if (!l.length) { lista.appendChild(el('div', 'pal-vacio', 'Sin resultados para "' + q + '"')); inp.removeAttribute('aria-activedescendant'); return; }
    let g = null; l.forEach((c, i) => {
      if (c.g !== g) { g = c.g; lista.appendChild(el('div', 'pal-g', g)); }
      const it = el('div', 'pal-it'); it.id = 'pal-' + i; it.dataset.i = i; it.setAttribute('role', 'option'); it.setAttribute('aria-selected', String(i === sel)); it.appendChild(ic(c.icono || 'ir')); const t = el('span', 't'); t.appendChild(resaltar(c.titulo, q)); it.appendChild(t);
      if (c.atajo) { const a = el('span', 'at'); c.atajo.split(' ').forEach(k => a.appendChild(el('kbd', '', k))); it.appendChild(a); } lista.appendChild(it);
    }); marcar();
  }
  function marcar(scroll = true) { lista.querySelectorAll('.pal-it').forEach(it => it.setAttribute('aria-selected', String(+it.dataset.i === sel))); const a = $('#pal-' + sel); if (a) { inp.setAttribute('aria-activedescendant', a.id); if (scroll) a.scrollIntoView({ block: 'nearest' }); } }
  function mover(d) { if (!vis.length) return; sel = (sel + d + vis.length) % vis.length; marcar(); }
  function ejecutar(i) { const c = vis[i]; if (!c) return; rec = [c.id, ...rec.filter(x => x !== c.id)].slice(0, 6); try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch (e) {} cerrar(); setTimeout(() => c.accion(), 60); }
  function abrir(inicial = '') { if (velo && velo.isConnected) return; previo = document.activeElement; construir(); modo = ''; sel = 0; inp.value = inicial; pintar(); requestAnimationFrame(() => velo.classList.add('on')); inp.focus(); }
  function cerrar() { if (!velo) return; const v = velo; v.classList.remove('on'); setTimeout(() => v.remove(), 180); velo = null; if (previo && previo.focus) previo.focus(); }
  window.Paleta = { registrar: c => cmds.push(c), abrir, cerrar };

  /* === COMANDOS (reemplazar por los de tu app) === */
  const P = (id, titulo, palabras) => window.Paleta.registrar({ id, tipo: 'pagina', grupo: 'Páginas', titulo: 'Ir a ' + titulo, palabras, icono: 'ir', accion: () => hecho('Navegaste a ' + titulo) });
  P('p1', 'Inicio', 'home panel resumen'); P('p2', 'Clientes', 'empresas contactos'); P('p3', 'Estudios', 'clima mystery rotacion'); P('p4', 'Informes', 'reportes pdf'); P('p5', 'Facturación', 'cobros pagos'); P('p6', 'Ajustes', 'configuracion preferencias');
  const A = (id, titulo, palabras, icono, atajo, fn) => window.Paleta.registrar({ id, tipo: 'accion', grupo: 'Acciones', titulo, palabras, icono, atajo, accion: fn });
  A('a1', 'Nuevo cliente', 'crear agregar empresa', 'mas', 'C', () => hecho('Formulario de nuevo cliente'));
  A('a2', 'Nuevo informe', 'crear reporte', 'mas', 'I', () => hecho('Nuevo informe creado'));
  A('a3', 'Nuevo estudio de clima', 'crear encuesta', 'mas', '', () => hecho('Nuevo estudio de clima'));
  A('a4', 'Copiar enlace del panel', 'compartir url', 'copiar', '', () => { try { navigator.clipboard.writeText(location.href); } catch (e) {} hecho('Enlace copiado'); });
  A('a5', 'Cambiar a tema claro u oscuro', 'modo oscuro claro tema', 'luna', 'T', () => { document.body.classList.toggle('tema-claro'); hecho('Tema cambiado'); });
  A('a6', 'Cerrar sesión', 'salir logout', 'salir', '', () => hecho('Sesión cerrada'));

  $('#btn-abrir').addEventListener('click', () => abrir());
  document.addEventListener('keydown', e => {
    const ed = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); velo && velo.isConnected ? cerrar() : abrir(); }
    else if (e.key === '/' && !ed && !(velo && velo.isConnected)) { e.preventDefault(); abrir(); }
    else if (!ed && !(velo && velo.isConnected) && !e.ctrlKey && !e.metaKey && !e.altKey) { const m = { c: 'a1', i: 'a2', t: 'a5' }[e.key.toLowerCase()]; if (m) { const c = cmds.find(x => x.id === m); if (c) c.accion(); } }
  });
});
</script>
</body>
</html>
