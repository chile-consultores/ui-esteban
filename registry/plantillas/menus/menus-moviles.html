<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Menús móviles · Chile Consultores</title>
<link rel="stylesheet" href="../[base]/base.css">
<!--
  Plantilla: 4 patrones móviles dentro de un teléfono simulado (barra de pestañas inferior con indicador, menú pantalla completa, botón flotante con acciones, hoja inferior arrastrable).
  Proyecto: apps y landings de Chile Consultores pensadas para celular.
  Cómo aplicarlo: copia el bloque del patrón (CSS + función). Cada uno funciona dentro de un contenedor con position:relative; en producción cámbialo a position:fixed.
  Conectar: reemplaza `ir(id)` por tu router y las acciones del FAB por tus funciones.
  Ganchos: .tabbar, .menu-full, .fab, .hoja, [data-abrir-hoja].
  Accesibilidad: aria-current en la pestaña activa, aria-expanded en disparadores, Escape cierra, foco atrapado en menú pantalla completa y hoja, targets de 44 px.
-->
<style>
  .pagina{max-width:1000px;margin:0 auto;padding:24px 16px 64px}
  .small{font-size:var(--fs-s);color:var(--texto-2)}
  .selec{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  .escena{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
  @media(max-width:760px){.escena{grid-template-columns:1fr;justify-items:center}}
  .tel{width:320px;max-width:100%;height:600px;border:8px solid #1b1b2a;border-radius:36px;background:var(--fondo,#0b0b14);position:relative;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5);display:flex;flex-direction:column}
  .tel::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:90px;height:20px;background:#1b1b2a;border-radius:12px;z-index:60}
  .app-cab{padding:34px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .app-cab h2{margin:0;font-size:1.05rem}
  .app-cuerpo{flex:1;overflow:auto;padding:6px 16px 90px;display:flex;flex-direction:column;gap:10px}
  .tarj{padding:14px;border:1px solid var(--borde);border-radius:14px;background:var(--superficie)}
  .tarj b{display:block}
  .guia{display:flex;flex-direction:column;gap:12px}
  .guia h2{margin:0;font-size:1.05rem}
  .guia ul{margin:0;padding-left:18px;color:var(--texto-2);font-size:var(--fs-s);display:grid;gap:6px}
  .ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .pan[hidden]{display:none}

  /* === COMPONENTE: tabbar inferior === */
  .tabbar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(18,18,30,.92);backdrop-filter:blur(14px);border-top:1px solid var(--borde);padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
  .tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;min-height:48px;border:0;background:none;color:var(--texto-2);font:inherit;font-size:.68rem;font-weight:600;cursor:pointer;border-radius:12px;transition:color .2s}
  .tabbar button[aria-current=page]{color:var(--texto)}
  .tabbar button[aria-current=page] svg{color:var(--acento);transform:translateY(-2px)}
  .tabbar svg{transition:transform .25s var(--ease-salida)}
  .tabbar .ind{position:absolute;top:0;left:6px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--marca),var(--acento));transition:transform .3s var(--ease-salida),width .3s}
  .tabbar .punto{position:absolute;top:4px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--rojo);color:#fff;font-size:.62rem;display:grid;place-items:center}

  /* === COMPONENTE: menu pantalla completa === */
  .menu-full{position:absolute;inset:0;z-index:50;background:rgba(9,9,18,.97);backdrop-filter:blur(16px);display:flex;flex-direction:column;padding:34px 22px 22px;clip-path:circle(0 at calc(100% - 40px) 50px);visibility:hidden;transition:clip-path .55s var(--ease-salida),visibility 0s .55s}
  .menu-full.on{clip-path:circle(150% at calc(100% - 40px) 50px);visibility:visible;transition:clip-path .55s var(--ease-salida)}
  .menu-full nav{display:flex;flex-direction:column;gap:2px;margin-top:18px}
  .menu-full nav a{font-size:1.7rem;font-weight:800;padding:10px 0;color:var(--texto);text-decoration:none;opacity:0;transform:translateY(14px);transition:opacity .3s,transform .4s var(--ease-salida)}
  .menu-full.on nav a{opacity:1;transform:none}
  .menu-full.on nav a:nth-child(1){transition-delay:.15s}.menu-full.on nav a:nth-child(2){transition-delay:.21s}.menu-full.on nav a:nth-child(3){transition-delay:.27s}.menu-full.on nav a:nth-child(4){transition-delay:.33s}.menu-full.on nav a:nth-child(5){transition-delay:.39s}
  .menu-full nav a:hover,.menu-full nav a:focus-visible{background:linear-gradient(90deg,var(--marca),var(--acento));-webkit-background-clip:text;background-clip:text;color:transparent}
  .menu-full .pie{margin-top:auto}
  .burger2{width:44px;height:44px;border-radius:12px;border:1px solid var(--borde);background:var(--superficie);color:var(--texto);display:grid;place-items:center;cursor:pointer;position:relative;z-index:55}

  /* === COMPONENTE: FAB con acciones === */
  .fab-caja{position:absolute;right:16px;bottom:82px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .fab{width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--marca),var(--acento));color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 26px rgba(124,109,242,.5);transition:transform .3s var(--ease-salida)}
  .fab[aria-expanded=true]{transform:rotate(45deg)}
  .fab-acc{display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
  .fab-acc button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--texto);font:inherit;font-weight:600;cursor:pointer;opacity:0;transform:translateY(14px) scale(.9);transition:opacity .2s,transform .3s var(--ease-salida)}
  .fab-acc button span.l{background:var(--superficie-2);border:1px solid var(--borde);padding:6px 10px;border-radius:8px;font-size:.82rem}
  .fab-acc button span.c{width:44px;height:44px;border-radius:50%;background:var(--superficie-2);border:1px solid var(--borde);display:grid;place-items:center}
  .fab-caja.on .fab-acc{pointer-events:auto}
  .fab-caja.on .fab-acc button{opacity:1;transform:none}
  .fab-caja.on .fab-acc button:nth-child(3){transition-delay:.02s}.fab-caja.on .fab-acc button:nth-child(2){transition-delay:.07s}.fab-caja.on .fab-acc button:nth-child(1){transition-delay:.12s}
  .fab-velo{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:25;opacity:0;pointer-events:none;transition:opacity .25s}
  .fab-velo.on{opacity:1;pointer-events:auto}

  /* === COMPONENTE: hoja inferior arrastrable === */
  .hoja-velo{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:44;opacity:0;pointer-events:none;transition:opacity .25s}
  .hoja-velo.on{opacity:1;pointer-events:auto}
  .hoja{position:absolute;left:0;right:0;bottom:0;z-index:45;background:var(--superficie-2);border-top:1px solid var(--borde);border-radius:22px 22px 0 0;padding:8px 16px 20px;transform:translateY(105%);transition:transform .35s var(--ease-salida);max-height:80%;display:flex;flex-direction:column;gap:6px;touch-action:none}
  .hoja.on{transform:translateY(var(--dy,0))}
  .hoja.arrastrando{transition:none}
  .hoja .asa{width:40px;height:5px;border-radius:3px;background:var(--borde);margin:4px auto 8px;cursor:grab}
  .hoja h3{margin:0 0 4px;font-size:1rem}
  .hoja .op{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:0;background:none;color:var(--texto);font:inherit;font-weight:600;cursor:pointer;text-align:left;min-height:48px}
  .hoja .op:hover,.hoja .op:focus-visible{background:rgba(255,255,255,.06)}
  .hoja .op.pel{color:var(--rojo)}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<main class="pagina">
  <header><h1 class="gradient-text" style="margin:0 0 6px">Menús móviles</h1><p class="small" style="margin:0">Cuatro patrones probados con el pulgar. Prueba cada uno dentro del teléfono.</p></header>
  <div class="selec" id="selec" role="tablist" aria-label="Patrón">
    <button class="btn btn-sm" role="tab" aria-selected="true" data-v="tab" type="button">Barra de pestañas</button>
    <button class="btn btn-sm btn-sec" role="tab" aria-selected="false" data-v="full" type="button">Pantalla completa</button>
    <button class="btn btn-sm btn-sec" role="tab" aria-selected="false" data-v="fab" type="button">Botón flotante</button>
    <button class="btn btn-sm btn-sec" role="tab" aria-selected="false" data-v="hoja" type="button">Hoja inferior</button>
  </div>
  <div class="escena">
    <div class="tel" id="tel" aria-label="Simulación de teléfono"></div>
    <div class="guia" id="guia" aria-live="polite"></div>
  </div>
</main>

<script src="../[base]/base.js" defer></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  const NS = 'http://www.w3.org/2000/svg';
  const IC = { inicio: 'M3 11l9-8 9 8v10H3z', buscar: 'M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5', estudios: 'M4 20V10M10 20V4M16 20v-8M22 20H2', mensajes: 'M21 15a2 2 0 01-2 2H8l-5 4V5a2 2 0 012-2h14a2 2 0 012 2z', perfil: 'M16 11a4 4 0 10-8 0 4 4 0 008 0zM4 21a8 8 0 0116 0', mas: 'M12 5v14M5 12h14', cerrar: 'M6 6l12 12M18 6L6 18', menu: 'M4 6h16M4 12h16M4 18h16', archivo: 'M6 2h9l5 5v15H6zM14 2v6h6', cliente: 'M16 11a4 4 0 10-8 0 4 4 0 008 0zM4 21a8 8 0 0116 0', nota: 'M4 4h16v16H4zM8 9h8M8 13h5', editar: 'M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z', copiar: 'M9 9h11v11H9zM5 15V4h11', compartir: 'M4 12v8h16v-8M12 16V3M7 8l5-5 5 5', borrar: 'M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15' };
  const ic = k => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'ico'); s.setAttribute('aria-hidden', 'true'); const p = document.createElementNS(NS, 'path'); p.setAttribute('d', IC[k]); s.appendChild(p); return s; };
  const toast = (m, t) => (window.UI && UI.toast) && UI.toast(m, t || 'info');
  const tel = $('#tel'), guia = $('#guia');
  let limpiar = null;
  const TABS = [['inicio', 'Inicio', 'inicio'], ['buscar', 'Buscar', 'buscar'], ['estudios', 'Estudios', 'estudios'], ['mensajes', 'Mensajes', 'mensajes'], ['perfil', 'Perfil', 'perfil']];

  function marco(titulo) {
    tel.replaceChildren(); const cab = el('div', 'app-cab'); const h = el('h2', '', titulo); h.id = 'tit-app'; cab.appendChild(h);
    const cu = el('div', 'app-cuerpo'); cu.id = 'cuerpo-app';
    ['Clima laboral 2026', 'Mystery shopper retail', 'Rotación de personal', 'Informe trimestral', 'Estudio de marca', 'Encuesta de salida'].forEach(t => { const a = el('div', 'tarj'); a.append(el('b', '', t), el('span', 'small', 'Actualizado hoy')); cu.appendChild(a); });
    tel.append(cab, cu); return { cab, cu, h };
  }
  function ayuda(t, items) { guia.replaceChildren(el('h2', '', t)); const u = el('ul'); items.forEach(x => u.appendChild(el('li', '', x))); guia.appendChild(u); }

  /* === 1. tabbar === */
  function vTab() {
    const { h, cu } = marco('Inicio'); const bar = el('nav', 'tabbar'); bar.setAttribute('aria-label', 'Principal'); const ind = el('span', 'ind'); ind.setAttribute('aria-hidden', 'true'); bar.appendChild(ind);
    const bs = TABS.map(([id, t, i], n) => { const b = el('button'); b.type = 'button'; b.dataset.id = id; b.append(ic(i), el('span', '', t)); if (id === 'mensajes') b.appendChild(el('span', 'punto', '3')); b.addEventListener('click', () => ir(n)); bar.appendChild(b); return b; });
    tel.appendChild(bar);
    function ir(n) { bs.forEach((b, i) => { if (i === n) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); }); const w = bs[0].offsetWidth - 12 + 12; ind.style.width = bs[n].offsetWidth - 12 + 'px'; ind.style.transform = 'translateX(' + (bs[n].offsetLeft - 6) + 'px)'; h.textContent = TABS[n][1]; cu.scrollTop = 0; }
    requestAnimationFrame(() => ir(0));
    ayuda('Barra de pestañas', ['Máximo 5 destinos. Más que eso va en "Más".', 'El indicador superior se desplaza, no salta.', 'Insignia de notificaciones con número.', 'Alto mínimo táctil de 48 px y área segura inferior (env safe-area).']);
  }

  /* === 2. pantalla completa === */
  function vFull() {
    const { cab } = marco('Inicio'); const bt = el('button', 'burger2'); bt.type = 'button'; bt.setAttribute('aria-label', 'Abrir menú'); bt.setAttribute('aria-expanded', 'false'); bt.append(ic('menu')); cab.appendChild(bt);
    const m = el('div', 'menu-full'); m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', 'Menú'); m.inert = true;
    const n = el('nav'); ['Inicio', 'Servicios', 'Estudios', 'Casos', 'Contacto'].forEach(t => { const a = el('a', '', t); a.href = '#'; a.addEventListener('click', e => { e.preventDefault(); cerrar(); toast('Ir a ' + t); }); n.appendChild(a); });
    const pie = el('div', 'pie'); pie.append(el('p', 'small', 'contacto@[dominio]'), el('p', 'small', 'Santiago, Chile')); m.append(n, pie); tel.appendChild(m);
    const cx = el('button', 'burger2'); cx.type = 'button'; cx.setAttribute('aria-label', 'Cerrar menú'); cx.style.cssText = 'position:absolute;right:18px;top:34px'; cx.append(ic('cerrar')); m.appendChild(cx);
    const abrir = () => { m.inert = false; m.classList.add('on'); bt.setAttribute('aria-expanded', 'true'); setTimeout(() => n.firstChild.focus(), 120); };
    function cerrar() { m.classList.remove('on'); m.inert = true; bt.setAttribute('aria-expanded', 'false'); bt.focus(); }
    bt.addEventListener('click', abrir); cx.addEventListener('click', cerrar);
    m.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); if (e.key === 'Tab') { const f = [...m.querySelectorAll('a,button')]; const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } } });
    ayuda('Menú pantalla completa', ['Se revela con un círculo desde el botón.', 'Los enlaces entran escalonados.', 'Usa inert en el contenedor para bloquear lo de atrás.', 'Escape y el botón X lo cierran y devuelven el foco.']);
  }

  /* === 3. FAB === */
  function vFab() {
    marco('Clientes'); const velo = el('div', 'fab-velo'); const caja = el('div', 'fab-caja'); const acc = el('div', 'fab-acc'); acc.id = 'fab-acc';
    [['archivo', 'Nuevo informe'], ['cliente', 'Nuevo cliente'], ['nota', 'Nueva nota']].forEach(([i, t]) => { const b = el('button'); b.type = 'button'; b.tabIndex = -1; const c = el('span', 'c'); c.appendChild(ic(i)); b.append(el('span', 'l', t), c); b.addEventListener('click', () => { cerrar(); toast(t); }); acc.appendChild(b); });
    const f = el('button', 'fab'); f.type = 'button'; f.setAttribute('aria-label', 'Crear'); f.setAttribute('aria-expanded', 'false'); f.setAttribute('aria-controls', 'fab-acc'); f.appendChild(ic('mas')); caja.append(acc, f); tel.append(velo, caja);
    const set = on => { caja.classList.toggle('on', on); velo.classList.toggle('on', on); f.setAttribute('aria-expanded', String(on)); acc.querySelectorAll('button').forEach(b => b.tabIndex = on ? 0 : -1); };
    function cerrar() { set(false); f.focus(); }
    f.addEventListener('click', () => set(f.getAttribute('aria-expanded') !== 'true')); velo.addEventListener('click', () => set(false));
    tel.addEventListener('keydown', e => { if (e.key === 'Escape' && caja.classList.contains('on')) cerrar(); });
    ayuda('Botón flotante con acciones', ['Una acción principal por pantalla.', 'El + gira a una X y abre las acciones en cascada.', 'Etiquetas de texto visibles, no solo iconos.', 'Los botones ocultos no reciben foco con Tab.']);
  }

  /* === 4. hoja inferior === */
  function vHoja() {
    const { cu } = marco('Estudios');
    $('#cuerpo-app').querySelectorAll('.tarj').forEach(t => { const b = el('button', 'btn btn-sec btn-sm', 'Opciones'); b.type = 'button'; b.dataset.abrirHoja = ''; b.style.marginTop = '8px'; b.setAttribute('aria-haspopup', 'dialog'); t.appendChild(b); b.addEventListener('click', () => abrir(t.querySelector('b').textContent, b)); });
    const velo = el('div', 'hoja-velo'); const h = el('div', 'hoja'); h.setAttribute('role', 'dialog'); h.setAttribute('aria-modal', 'true'); h.setAttribute('aria-labelledby', 'tit-hoja'); h.inert = true;
    const asa = el('div', 'asa'); asa.setAttribute('aria-hidden', 'true'); const tt = el('h3', '', ''); tt.id = 'tit-hoja'; h.append(asa, tt);
    [['editar', 'Editar', ''], ['copiar', 'Duplicar', ''], ['compartir', 'Compartir', ''], ['borrar', 'Eliminar', 'pel']].forEach(([i, t, c]) => { const o = el('button', 'op ' + c); o.type = 'button'; o.append(ic(i), document.createTextNode(t)); o.addEventListener('click', () => { cerrar(); toast(t + ': ' + tt.textContent, c ? 'error' : 'info'); }); h.appendChild(o); });
    tel.append(velo, h); let ult = null;
    function abrir(n, b) { ult = b; tt.textContent = n; h.inert = false; h.style.removeProperty('--dy'); h.classList.add('on'); velo.classList.add('on'); setTimeout(() => h.querySelector('.op').focus(), 80); }
    function cerrar() { h.classList.remove('on'); velo.classList.remove('on'); h.inert = true; if (ult) ult.focus(); }
    velo.addEventListener('click', cerrar);
    h.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); if (e.key === 'Tab') { const f = [...h.querySelectorAll('.op')]; const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } } });
    let y0 = null, dy = 0;
    h.addEventListener('pointerdown', e => { if (e.target.closest('.op')) return; y0 = e.clientY; dy = 0; h.classList.add('arrastrando'); h.setPointerCapture(e.pointerId); });
    h.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); h.style.setProperty('--dy', dy + 'px'); });
    const fin = () => { if (y0 == null) return; y0 = null; h.classList.remove('arrastrando'); if (dy > 90) cerrar(); else h.style.removeProperty('--dy'); dy = 0; };
    h.addEventListener('pointerup', fin); h.addEventListener('pointercancel', fin);
    ayuda('Hoja inferior', ['Se abre desde "Opciones" de cada tarjeta.', 'Arrastra el asa hacia abajo más de 90 px para cerrar.', 'Acciones destructivas en rojo y al final.', 'Foco atrapado dentro mientras está abierta.']);
  }

  const V = { tab: vTab, full: vFull, fab: vFab, hoja: vHoja };
  const sel = [...document.querySelectorAll('#selec [role=tab]')];
  function montar(v) { sel.forEach(b => { const on = b.dataset.v === v; b.setAttribute('aria-selected', on); b.classList.toggle('btn-sec', !on); }); V[v](); }
  sel.forEach(b => b.addEventListener('click', () => montar(b.dataset.v)));
  montar('tab');
});
</script>
</body>
</html>
