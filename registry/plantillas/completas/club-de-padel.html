<!--
  Plataforma completa: gestión de club de pádel (sirve para cualquier club con canchas).
  Módulos que se activan por separado: reservas de cancha de cualquier duración (con turnos fijos y página pública con las duraciones que elija el club, academias, eventos y torneos), socios y planes, clases con asistencia, caja con cierre diario y torneos (enlaza a torneos.html).
  Usuarios y permisos: varios usuarios por club, cada uno con un rol; por rol y por módulo se define sin acceso, ver o editar. En la demo cambias de usuario con "Entrar como".
  Conectar: reemplaza la carga y guardar() (hoy localStorage). Tablas sugeridas en Supabase: clubs, club_users (rol), role_permissions, courts, members, bookings, classes, class_students, attendance, cash_movements, cash_closings. Los permisos de la demo son solo de interfaz: en producción van con RLS.
  Ganchos: #cl-top, #cl-vista. Marca: tokens html[data-tema] al inicio del <style>.
-->
