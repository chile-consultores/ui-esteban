<!doctype html>
<html lang="es-CL" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Torneos · Chile Consultores</title>
<script>try{document.documentElement.dataset.tema=localStorage.getItem('cc_tema_torneos')||'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<link rel="stylesheet" href="../[base]/base.css">
<!--
  Plataforma completa: gestión de torneos. Inscripción con restricciones horarias, cuadros automáticos por categoría,
  programación de canchas y horarios, carga de resultados con avance automático y vista pública.
  Deportes: pádel (el más afinado), tenis, pickleball, fútbol, vóleibol y básquetbol. El selector de deporte carga otra configuración completa.
  Formatos: grupos + playoff (Oro y Plata), eliminación directa con consolación, liga, doble eliminación, americano y mexicano.
  Cómo aplicarlo: el objeto Motor no toca el DOM (cuadros, tablas, horarios, resultados) y se puede usar tal cual en otra interfaz o en una Edge Function.
  Conectar: reemplaza API.cargar y API.guardar (hoy localStorage). Tablas sugeridas en Supabase: tournaments, courts, court_blocks,
  categories, registrations (con no_disp), matches. La inscripción pública debe ir por una RPC o Edge Function, no con insert directo.
  Marca: los colores viven en los tokens de html[data-tema] al inicio del <style>; cámbialos por los del cliente.
  Ganchos: #tn-vista (contenido), #tn-top (barra y pestañas), Motor.programar(), Motor.generarCuadro(), Motor.registrarResultado().
  Estados de demo por URL: ?demo=cargando | error | vacio (no guardan nada).
-->
<style>
  /* Tema "deportivo claro": un solo color de marca (verde cancha), líneas finas, sin sombras. Cambia estos tokens por los de tu marca. */
  html[data-tema]{--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--display:var(--sans);--r:10px;--r-s:8px;--r-xs:6px;--max:1280px;--fs-b:1rem;--fs-s:.875rem;--fs-xs:.8125rem;--fs-m:1.0625rem;--fs-l:clamp(1.375rem,1.2rem + .8vw,1.75rem);--sombra:none}
  html[data-tema="claro"]{--marca:#0F7A4D;--marca-d:#0B6340;--marca-l:rgba(15,122,77,.10);--sobre-marca:#fff;--acento:#0F7A4D;--acento-l:rgba(15,122,77,.10);--fondo:#F7F7F4;--fondo-2:#fff;--superficie:#fff;--superficie-2:#EFEFEA;--borde:rgba(20,24,20,.12);--borde-2:rgba(20,24,20,.26);--texto:#141814;--texto-2:#4A524C;--texto-3:#667068}
  html[data-tema="oscuro"]{--marca:#3FBF85;--marca-d:#5ACC97;--marca-l:rgba(63,191,133,.15);--sobre-marca:#06130D;--acento:#3FBF85;--acento-l:rgba(63,191,133,.15);--fondo:#0E1210;--fondo-2:#141917;--superficie:#171D1A;--superficie-2:#212A25;--borde:rgba(255,255,255,.10);--borde-2:rgba(255,255,255,.22);--texto:#E8ECE9;--texto-2:#A3ADA7;--texto-3:#7C8780}
  html[data-tema] .menu,html[data-tema] .modal,html[data-tema] .toast{background:var(--fondo-2)}
  html[data-tema="oscuro"] .btn:disabled{background:#232B27;color:var(--texto-3)} html[data-tema="oscuro"] .switch{background:#3A443F} html[data-tema="oscuro"] .switch[aria-checked="true"]{background:var(--marca)}
  [hidden]{display:none!important}
  h1,h2,h3,h4{font-weight:700;letter-spacing:-.01em}
  .btn{border-radius:var(--r-s);font-weight:600} .btn:not(.btn-sec):not(.btn-ghost):not(.btn-danger):not(:disabled){color:var(--sobre-marca)}
  .card{box-shadow:none} .badge{font-weight:600}
  .btn,.input,.select{min-height:40px} .btn-sm{min-height:34px} .btn-icon{min-height:36px}
  @media (pointer:coarse){.btn,.input,.select{min-height:44px}.btn-sm{min-height:40px}.btn-icon{width:44px;height:44px}}
  @media (max-width:640px){.input,.select,.textarea{font-size:16px}}
  /* Marco: barra superior y pestañas */
  .tn-top{position:sticky;top:0;z-index:20;background:var(--fondo-2);border-bottom:1px solid var(--borde)}
  .tn-barra,.tn-tabs,.tn-torneo-cab{max-width:var(--max);margin:0 auto;padding:0 24px}
  .tn-barra{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
  .tn-logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--texto);font-size:var(--fs-m)} .tn-logo:hover{text-decoration:none}
  .tn-marca{width:28px;height:28px;border-radius:7px;background:var(--marca);color:var(--sobre-marca);display:grid;place-items:center;flex:none} .tn-marca svg{width:16px;height:16px}
  .tn-barra .select{width:auto;min-width:150px} .tn-sep{flex:1}
  .tn-torneo-cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px;border-top:1px solid var(--borde)}
  .tn-torneo-cab strong{font-size:var(--fs-m)} .tn-torneo-cab .volver{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-s);color:var(--texto-2);font-weight:600}
  .tn-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  .tn-tabs a{display:flex;align-items:center;gap:6px;padding:10px 12px;font-size:var(--fs-s);font-weight:600;color:var(--texto-2);border-bottom:3px solid transparent;white-space:nowrap}
  .tn-tabs a:hover{color:var(--texto);text-decoration:none} .tn-tabs a[aria-current="page"]{color:var(--texto);border-bottom-color:var(--marca)}
  .tn-cuenta{font-size:var(--fs-xs);font-weight:700;padding:0 7px;border-radius:var(--pill);background:var(--ambar-l);color:var(--ambar)}
  .contenido{margin:0 auto;padding:24px} .contenido h1{font-size:var(--fs-l)} .contenido h1:focus{outline:none} .contenido h2{font-size:var(--fs-m)} .contenido h3{font-size:var(--fs-b)}
  @media (max-width:640px){.tn-barra,.tn-tabs,.tn-torneo-cab{padding-left:16px;padding-right:16px}.contenido{padding:16px}.tn-barra .select{min-width:0}}
  /* Piezas comunes */
  .tn-fila{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
  .tn-fila .campo{flex:1;min-width:140px;margin:0} .tn-fila .campo.corto{flex:0 0 150px;min-width:120px}
  .tn-auto{width:auto} .tn-sw{gap:10px}
  .tn-seccion{margin-bottom:16px;scroll-margin-top:150px} .tn-seccion > h2{margin-bottom:4px} .tn-seccion > p{margin-bottom:16px}
  .tn-guardado{font-size:var(--fs-xs);color:var(--texto-2);min-height:1.2em}
  .tn-caps{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tn-caps .chip{font-size:var(--fs-s);padding:7px 14px;color:var(--texto);font-weight:600;background:var(--superficie)}
  .tn-caps .chip[aria-pressed="true"]{background:var(--texto);border-color:var(--texto);color:var(--fondo-2)}
  .tn-caps .chip .n{font-weight:400;opacity:.75}
  .tn-caps-et{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--texto-2);min-width:84px}
  .tn-filtros{display:flex;flex-direction:column;gap:10px;padding:12px 16px;border:1px solid var(--borde);border-radius:var(--r);background:var(--superficie);margin-bottom:8px}
  .tn-punto{width:10px;height:10px;border-radius:3px;background:var(--col);flex:none}
  .tn-dia{display:flex;align-items:center;gap:12px;margin:28px 0 10px;font-size:var(--fs-s);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--texto-2)}
  .tn-dia::after{content:"";flex:1;border-top:1px solid var(--borde-2)}
  .tn-pasos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .tn-pasos li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--borde)} .tn-pasos li:last-child{border-bottom:0}
  .tn-pasos .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700;background:var(--superficie-2);flex:none}
  .tn-pasos li.listo .n{background:var(--verde-l);color:var(--verde)} .tn-pasos .t{flex:1;min-width:0}
  .tn-torneos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .tn-torneo{display:flex;flex-direction:column;gap:8px} .tn-torneo h3 a{color:var(--texto)}
  .tn-deportes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} @media (max-width:520px){.tn-deportes{grid-template-columns:repeat(2,1fr)}}
  .tn-deportes label{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--borde-2);border-radius:var(--r-s);cursor:pointer;font-size:var(--fs-s)}
  .tn-deportes input{accent-color:var(--marca)} .tn-deportes label:has(input:checked){border-color:var(--marca);background:var(--marca-l)}
  .tn-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .tn-lista li{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tn-orden{display:flex;gap:2px}
  .tn-crit{counter-reset:c} .tn-crit li{counter-increment:c;padding:6px 8px 6px 12px;border:1px solid var(--borde);border-radius:var(--r-s);justify-content:space-between}
  .tn-crit li span::before{content:counter(c) ". ";color:var(--texto-2)}
  /* Categorías en configuración */
  .tn-cats-l{list-style:none;margin:0;padding:0;border:1px solid var(--borde);border-radius:var(--r);overflow:hidden}
  .tn-cats-l li{display:grid;grid-template-columns:auto auto minmax(140px,1.2fr) minmax(0,2fr) auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--borde)}
  .tn-cats-l li:first-child{border-top:0} .tn-cats-l .input{font-weight:600}
  .tn-cats-l input[type=checkbox],.tn-masivo input[type=checkbox]{width:18px;height:18px;accent-color:var(--marca)}
  .tn-masivo{padding:12px;border:1px dashed var(--borde-2);border-radius:var(--r);margin-bottom:12px;background:var(--fondo)}
  @media (max-width:760px){.tn-cats-l li{grid-template-columns:auto auto 1fr}.tn-cats-l li > .res,.tn-cats-l li > .tn-orden{grid-column:1/-1}}
  /* Grilla de horas (restricciones) */
  .tn-horas-wrap{overflow-x:auto}
  .tn-horas{border-collapse:separate;border-spacing:4px;font-size:var(--fs-xs)}
  .tn-horas th{font-weight:500;color:var(--texto-2);padding:2px 6px;white-space:nowrap;text-align:center} .tn-horas tbody th{text-align:right;font-variant-numeric:tabular-nums}
  .tn-celda{display:grid;place-items:center;width:100%;min-width:72px;height:32px;border-radius:6px;border:1px solid var(--borde-2);background:var(--fondo-2);color:var(--texto-2);cursor:pointer;font-size:var(--fs-xs)}
  .tn-celda[aria-pressed="true"]{background:var(--rojo-l);border-color:var(--rojo);color:var(--texto)} .tn-celda[aria-pressed="true"]::after{content:"No puedo"}
  .tn-horas.prot .tn-celda[aria-pressed="true"]{background:var(--marca-l);border-color:var(--marca)} .tn-horas.prot .tn-celda[aria-pressed="true"]::after{content:"Protegido"}
  .tn-celda.prot{cursor:default;background:var(--superficie-2);border-style:dashed} .tn-celda.prot svg{width:14px;height:14px} .tn-celda:disabled{cursor:default}
  @media (pointer:coarse){.tn-celda{height:40px}}
  /* Filas de partido */
  .tn-filas{list-style:none;margin:0;padding:0;border:1px solid var(--borde);border-radius:var(--r);background:var(--superficie);overflow:hidden}
  .tn-filap{display:grid;grid-template-columns:96px 170px minmax(0,1fr) 150px;gap:6px 16px;align-items:center;padding:10px 14px 10px 12px;border-top:1px solid var(--borde);border-left:4px solid var(--col)}
  .tn-filap:first-child{border-top:0}
  .tn-filas.corta .tn-filap{grid-template-columns:96px 96px minmax(0,1fr) 150px}
  .tn-filap .hora{font-variant-numeric:tabular-nums;font-weight:700} .tn-filap small{display:block;font-weight:400;color:var(--texto-2);font-size:var(--fs-xs)}
  .tn-filap .cat{font-size:var(--fs-xs);color:var(--texto-2);min-width:0} .tn-filap .cat strong{display:block;color:var(--texto);font-size:var(--fs-s);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tn-filap .acc{justify-self:end}
  .tn-vs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;font-size:var(--fs-s)}
  .tn-vs span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .tn-vs .gana{font-weight:700} .tn-vs .pend{color:var(--texto-2)} .tn-vs .m{font-variant-numeric:tabular-nums;white-space:pre;text-align:right}
  @media (max-width:820px){.tn-filap,.tn-filas.corta .tn-filap{grid-template-columns:1fr auto}.tn-filap .hora{display:flex;gap:8px;align-items:baseline}.tn-filap .cat{text-align:right}.tn-vs{grid-column:1/-1}.tn-filap .acc{grid-column:1/-1;justify-self:start}}
  /* Grupos y llaves */
  .tn-partido{display:flex;flex-direction:column;width:100%;text-align:left;border:1px solid var(--borde-2);border-radius:var(--r-s);background:var(--fondo-2);color:var(--texto);padding:0;font-size:var(--fs-s);min-height:0}
  button.tn-partido{cursor:pointer} button.tn-partido:hover{border-color:var(--texto-2)}
  .tn-partido.bye{opacity:.55} .tn-partido.vacio{visibility:hidden}
  .tn-lado{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;min-width:0} .tn-lado + .tn-lado{border-top:1px solid var(--borde)}
  .tn-lado.gana{font-weight:700} .tn-lado.pend{color:var(--texto-2)}
  .tn-nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0} .tn-marc{font-variant-numeric:tabular-nums;white-space:pre;flex:none}
  .tn-meta{display:flex;justify-content:space-between;gap:8px;padding:4px 10px;border-top:1px solid var(--borde);font-size:var(--fs-xs);color:var(--texto-2);background:var(--fondo)}
  .tn-grupos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:24px}
  .tn-grupo{display:flex;flex-direction:column;gap:10px} .tn-grupo h4{font-size:var(--fs-b)}
  .tn-grupo .tabla th,.tn-grupo .tabla td{padding:8px} .tn-grupo .tabla td:nth-child(2){white-space:nowrap}
  .tabla tr.tn-clas td:first-child{box-shadow:inset 3px 0 0 var(--verde)}
  .tn-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
  .tn-llave{display:flex;gap:24px;overflow-x:auto;padding:4px 4px 12px}
  .tn-ronda{display:flex;flex-direction:column;gap:8px;min-width:240px;flex:none}
  .tn-ronda h4{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--texto-2)}
  .tn-col{display:flex;flex-direction:column;justify-content:space-around;gap:12px;flex:1}
  .tn-campeon{display:flex;align-items:center;gap:12px} .tn-campeon .tn-marca{background:var(--ambar-l);color:var(--ambar)}
  /* Programación */
  .tn-grilla{--alto:16px;display:grid;grid-template-columns:52px repeat(var(--c),minmax(150px,1fr));overflow:auto;max-height:74vh;border:1px solid var(--borde-2);border-radius:var(--r);background:var(--superficie)}
  .tn-g-cab{position:sticky;top:0;z-index:3;background:var(--fondo-2);padding:8px;font-size:var(--fs-xs);font-weight:700;border-bottom:1px solid var(--borde-2);text-align:center} .tn-g-cab.esq{left:0;z-index:4}
  .tn-g-riel,.tn-g-col{position:relative;height:calc(var(--n)*var(--alto))}
  .tn-g-riel{position:sticky;left:0;z-index:2;background:var(--fondo-2);border-right:1px solid var(--borde)}
  .tn-g-riel span{position:absolute;right:6px;margin-top:2px;font-size:var(--fs-xs);color:var(--texto-2);font-variant-numeric:tabular-nums}
  .tn-g-col{border-right:1px solid var(--borde);background-image:linear-gradient(var(--borde) 1px,transparent 1px);background-size:100% calc(var(--alto)*var(--ph));background-position:0 var(--off)}
  .tn-bloque{position:absolute;left:3px;right:3px;border:0;border-left:4px solid var(--col);border-radius:6px;background:color-mix(in srgb,var(--col) 14%,var(--fondo-2));color:var(--texto);padding:3px 6px;text-align:left;font-size:var(--fs-xs);line-height:1.3;overflow:hidden;cursor:grab;display:flex;flex-direction:column;min-height:0;touch-action:manipulation}
  .tn-bloque span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .tn-bloque .h{color:var(--texto-2);font-weight:600}
  .tn-bloque.jugado{opacity:.55;cursor:pointer} .tn-bloque.fijo{box-shadow:inset 0 0 0 1px var(--texto-2)} .tn-bloque.error{box-shadow:inset 0 0 0 2px var(--rojo)}
  .tn-bloque.arrastrando{opacity:.35} .tn-bloque.destino{outline:3px solid var(--marca);outline-offset:1px;z-index:1}
  .tn-g-bloq{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,var(--superficie-2) 0 6px,transparent 6px 12px);font-size:var(--fs-xs);color:var(--texto-2);padding:4px 6px;overflow:hidden}
  .tn-gota{position:absolute;left:0;right:0;border-top:3px solid var(--marca);pointer-events:none;z-index:2} .tn-gota span{position:absolute;right:4px;top:2px;font-size:var(--fs-xs);font-weight:700;background:var(--marca);color:var(--sobre-marca);padding:0 6px;border-radius:4px}
  .tn-fantasma{position:fixed;left:0;top:0;z-index:70;pointer-events:none;background:var(--texto);color:var(--fondo-2);font-size:var(--fs-xs);font-weight:600;padding:6px 10px;border-radius:6px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.tn-drag{user-select:none;-webkit-user-select:none;cursor:grabbing} body.tn-drag *{cursor:grabbing!important}
  .tn-bandeja{display:flex;gap:8px;flex-wrap:wrap;max-height:190px;overflow:auto}
  .tn-suelto{display:flex;flex-direction:column;align-items:flex-start;gap:0;border:1px solid var(--borde-2);border-left:4px solid var(--col);border-radius:6px;background:var(--fondo-2);color:var(--texto);padding:4px 10px;font-size:var(--fs-xs);cursor:grab;text-align:left;max-width:260px;min-height:0;touch-action:manipulation}
  .tn-suelto span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%} .tn-suelto .h{color:var(--texto-2);font-weight:600}
  .tn-leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--texto-2)} .tn-leyenda span{display:inline-flex;align-items:center;gap:6px}
  .tn-avisos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .tn-avisos li{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:var(--fs-s)}
  /* Tarjeta de partido y grilla por turnos */
  .tn-pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px}
  .tn-pc{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:1px solid var(--borde-2);border-left:5px solid var(--col);border-radius:var(--r);background:var(--fondo-2);color:var(--texto);padding:8px 10px;font-size:var(--fs-s);min-height:0;cursor:pointer}
  div.tn-pc{cursor:default} button.tn-pc:hover{border-color:var(--texto-2);border-left-color:var(--col)}
  .tn-pc .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--texto-2);margin-bottom:2px}
  .tn-pc .top .c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600} .tn-pc .badge{flex:none;padding:1px 8px}
  .tn-pc .l{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600} .tn-pc .l.pierde,.tn-pc .l.pend{font-weight:400;color:var(--texto-2)} .tn-pc .l.gana{font-weight:700}
  .tn-pc .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tn-pc .pres{color:var(--verde);font-weight:700} .tn-pc .sc{display:flex;gap:4px;flex:none}
  .tn-pc .sc b{min-width:22px;text-align:center;padding:1px 4px;border-radius:5px;background:var(--superficie-2);font-variant-numeric:tabular-nums;font-size:var(--fs-xs);font-weight:600} .tn-pc .l.gana .sc b{background:var(--marca-l);color:var(--texto)}

  const catDe = (t, id) => t.categorias.find(c => c.id === id);

  const INS = id => ({ tipo: 'ins', id }), GAN = m => ({ tipo: 'gan', de: m.id }), PER = m => ({ tipo: 'per', de: m.id }), LIBRE = () => ({ tipo: 'bye' }), DUO = ids => ({ tipo: 'duo', ids });
